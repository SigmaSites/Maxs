<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Max's</title>
  <link rel="icon" href="assets/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=2">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0e0c; --surface: #1a1916; --surface2: #242220; --border: #2e2c28;
      --accent: #e8c97e; --text: #f0ece4; --muted: #7a7468;
      --danger: #c0614a; --success: #6a9e72; --radius: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1000; opacity: 0.6;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    }
    header { border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 70px; position: sticky; top: 0; background: rgba(15,14,12,0.92); backdrop-filter: blur(12px); z-index: 100; }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; letter-spacing: -0.02em; color: var(--accent); }
    .logo span { color: var(--text); }
    .my-name-tag { display: flex; align-items: center; gap: 0.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.35rem 0.75rem; font-size: 0.85rem; cursor: pointer; transition: border-color 0.15s; }
    .my-name-tag:hover { border-color: var(--accent); }
    .my-name-tag .name-label { color: var(--muted); font-size: 0.75rem; }
    .my-name-tag .name-val { color: var(--accent); font-weight: 500; }
    .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1.1rem; border-radius: 8px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.875rem; font-weight: 500; transition: all 0.18s ease; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
    .btn-accent { background: var(--accent); color: #0f0e0c; font-weight: 600; }
    .btn-accent:hover { background: #f0d590; transform: translateY(-1px); }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    .btn-danger:hover { background: var(--danger); color: white; }
    .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
    .btn-full { width: 100%; justify-content: center; }
    main { max-width: 1200px; margin: 0 auto; padding: 3rem 2rem; }
    .hero { text-align: center; padding: 3rem 0 4rem; }
    .hero-tag { display: inline-block; background: rgba(232,201,126,0.1); border: 1px solid rgba(232,201,126,0.25); color: var(--accent); font-size: 0.75rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.3rem 0.9rem; border-radius: 100px; margin-bottom: 1.25rem; }
    .hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: 900; line-height: 1.1; letter-spacing: -0.03em; margin-bottom: 1rem; }
    .hero h1 em { font-style: italic; color: var(--accent); }
    .hero p { color: var(--muted); font-size: 1.05rem; max-width: 500px; margin: 0 auto; line-height: 1.7; }
    .stats-bar { display: flex; justify-content: center; gap: 3rem; padding: 1.5rem 2rem; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: 3rem; }
    .stat { text-align: center; }
    .stat-value { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 0.1rem; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem; }
    .section-header h2 { font-family: 'Playfair Display', serif; font-size: 1.75rem; font-weight: 700; }
    .filter-tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .tab { padding: 0.35rem 0.85rem; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 0.8rem; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
    .tab.active, .tab:hover { background: var(--surface); color: var(--text); border-color: rgba(232,201,126,0.3); }
    .tab.active { color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color 0.2s, transform 0.2s; animation: fadeUp 0.4s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .card:hover { border-color: rgba(232,201,126,0.3); transform: translateY(-2px); }
    .card-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--surface2); display: block; }
    .card-img-placeholder { width: 100%; aspect-ratio: 16/9; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 3rem; }
    .card-body { padding: 1.25rem; }
    .card-category { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); font-weight: 500; margin-bottom: 0.4rem; }
    .card-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; margin-bottom: 0.4rem; line-height: 1.2; }
    .card-desc { font-size: 0.875rem; color: var(--muted); line-height: 1.6; margin-bottom: 1rem; }
    .card-meta { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.75rem; font-weight: 500; }
    .badge-available { background: rgba(106,158,114,0.15); color: var(--success); }
    .badge-taken { background: rgba(192,97,74,0.15); color: var(--danger); }
    .badge-price { background: rgba(232,201,126,0.1); color: var(--accent); }
    .registrations { border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 0.75rem; }
    .reg-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.5rem; }
    .reg-others { font-size: 0.8rem; color: var(--muted); padding: 0.4rem 0.7rem; background: var(--surface2); border-radius: 6px; text-align: center; }
    .my-reg-box { margin-top: 0.75rem; background: rgba(232,201,126,0.06); border: 1px solid rgba(232,201,126,0.2); border-radius: 8px; padding: 0.85rem; }
    .my-reg-box .my-reg-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 0.5rem; }
    .my-reg-row { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; margin-bottom: 0.2rem; }
    .my-reg-row .muted { color: var(--muted); font-size: 0.75rem; }
    .cancel-link { margin-top: 0.6rem; font-size: 0.78rem; color: var(--danger); cursor: pointer; background: none; border: none; font-family: 'DM Sans', sans-serif; padding: 0; display: inline-block; }
    .cancel-link:hover { text-decoration: underline; }
    .reserve-form { margin-top: 0.75rem; border-top: 1px solid var(--border); padding-top: 0.85rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .reserve-form label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
    .reserve-form select, .reserve-form textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 0.55rem 0.75rem; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.875rem; outline: none; transition: border-color 0.18s; }
    .reserve-form select:focus, .reserve-form textarea:focus { border-color: var(--accent); }
    .reserve-form select option { background: var(--surface2); }
    .reserve-form textarea { resize: none; min-height: 60px; }
    .reserve-form textarea::placeholder { color: var(--muted); }
    .reserve-form-err { font-size: 0.78rem; color: var(--danger); display: none; }
    .reserve-form-err.visible { display: block; }
    .reserve-form-btns { display: flex; gap: 0.5rem; }
    .reserve-form-btns button { flex: 1; }
    .reserve-btn-wrap { margin-top: 0.75rem; }
    .empty { text-align: center; padding: 5rem 2rem; color: var(--muted); }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
    .empty h3 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--text); margin-bottom: 0.5rem; }
    .toast-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 500; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 1.1rem; font-size: 0.875rem; display: flex; align-items: center; gap: 0.6rem; animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
    @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes fadeOut { to { opacity: 0; transform: translateX(20px); } }
    .toast.success { border-color: rgba(106,158,114,0.4); }
    .toast.error { border-color: rgba(192,97,74,0.4); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.visible { opacity: 1; pointer-events: all; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; width: 100%; max-width: 400px; transform: translateY(20px); transition: transform 0.2s; }
    .modal-overlay.visible .modal { transform: translateY(0); }
    .modal h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin-bottom: 0.4rem; }
    .modal .modal-subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.25rem; }
    .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.25rem; }
    .modal input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 0.65rem 0.85rem; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none; transition: border-color 0.18s; }
    .modal input:focus { border-color: var(--accent); }
    .modal input::placeholder { color: var(--muted); }
    .modal p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.25rem; line-height: 1.6; }
    @media (max-width: 600px) { .stats-bar { gap: 1.5rem; } }
    .fil-picker { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .fpick-btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.65rem; border-radius: 20px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.78rem; transition: all 0.15s; }
    .fpick-btn:hover { border-color: var(--accent); color: var(--text); }
    .fpick-btn.selected { border-color: var(--accent); background: rgba(232,201,126,0.12); color: var(--text); }
    .fpick-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; position: relative; }
    .fpick-dot.dual::before, .fpick-dot.dual::after { content: ''; position: absolute; top: 0; width: 50%; height: 100%; }
    .fpick-dot.dual::before { left: 0; background: var(--c1); border-radius: 50% 0 0 50%; }
    .fpick-dot.dual::after { right: 0; background: var(--c2); border-radius: 0 50% 50% 0; }
    .cat-section { grid-column: 1 / -1; margin-top: 1rem; }
    .cat-section:first-child { margin-top: 0; }
    .cat-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem; }
    .cat-label { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--accent); white-space: nowrap; }
    .cat-line { flex: 1; height: 1px; background: var(--border); }
    /* LOGO */
    .logo { display: flex; align-items: center; gap: 0.7rem; }
    .logo-img { height: 24px; width: auto; display: block; }
    @media (max-width: 480px) { .logo-img { height: 20px; } }
  </style>
</head>
<body>
  <div>'s</div>
<header>
  </body>
</html>
